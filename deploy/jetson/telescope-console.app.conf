# Drop-in do telescope-console.service: o console como app.
#   - também na porta 80, para o endereço ser só http://telescopio.local (sem :8080);
#   - CAP_NET_BIND_SERVICE deixa o usuário comum abrir a 80, sem rodar como root.
# A 8080 continua valendo. O canal em tempo real (WebSocket) sobe na 8081 (--port + 1).
# Instalado por scripts/jetson_setup_app.sh.
[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
ExecStart=
ExecStart=/usr/bin/python3 run_console.py --host 0.0.0.0 --port 8080 --also-port 80
