# Drop-in do telescope-console.service: liga o link automático com a montagem REAL.
# Sem TELE_MOUNT=indi o console segue nos simuladores (é o caso do PC de dev e da CI).
# Os demais valores têm padrão no código (src/control/mount_link.py):
#   TELE_MOUNT_PORT=/dev/telescope-mount   TELE_MOUNT_BAUD=115200   TELE_MOUNT_DEVICE="LX200 OnStep"
#   TELE_SITE=-23.55,-46.63,760            (lat, lon leste-positivo, altitude em m)
# Instalado por scripts/jetson_setup_mount.sh.
[Service]
Environment=TELE_MOUNT=indi
