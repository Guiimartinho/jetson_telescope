# Drop-in do telescope-console.service: liga a API do app do celular.
#   - HTTPS e WSS na porta 8443, só TLS 1.3, com o certificado do próprio aparelho;
#   - só celular pareado (QR) entra; o pareamento se abre com:  python3 -m src.api.cli pair
#   - com a API ligada o console web vira SÓ LEITURA: comando por HTTP aberto, ao lado de uma
#     API protegida, seria a porta dos fundos (app/docs/07-seguranca.md §9).
# É por variável de ambiente (como TELE_MOUNT) para somar com os outros drop-ins, sem um
# sobrescrever o ExecStart do outro. Instalado por scripts/jetson_setup_api.sh.
[Service]
Environment=TELE_API=1
